  HockeyStack's conformance posture moved backwards between rounds. The OAuth
  discovery documents that earned it RFC 8414 / RFC 9728 / OIDC-discovery credit in
  July return 404 on every host in August. Its REST API conforms to no
  cross-cutting API standard — no problem+json, no standard rate-limit headers, no
  idempotency keys, no published spec of any kind.
