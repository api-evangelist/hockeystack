apis:
- name: HockeyStack Revenue Agents API
  description: >-
    Version 1 of the HockeyStack Revenue Agents API. Attaches AI agents to companies
    and deals from the connected CRM, holds conversations with those agents, manages
    the tasks they generate, and reads the workspace credit ledger that meters it
    all. Thirty operations across five groups (service, agents, conversations, tasks,
    credits). Authenticated with a workspace bearer token formatted hsr_live_<hex>.
    HockeyStack publishes no OpenAPI for this API — it is documented only in the
    README of its own npm MCP server package, which is where this profile's
    operation list, routes and semantics were read from.
  humanURL: https://agents-docs.hockeystack.com/
  baseURL: https://app.hockeystack.com/api/revenue-agents/v1
