name: HockeyStack
description: >-
  HockeyStack is a B2B revenue and marketing data intelligence platform that unifies
  marketing, sales, and product data to reveal the full buyer journey from first
  anonymous (cookieless) touch to closed-won. It applies multiple attribution models,
  account and intent scoring, lift/incrementality analysis, and no-SQL custom
  dashboards, and deploys AI "Revenue Agents" (via its ATLAS data foundation and the
  hosted "Omni" MCP server) to forecast pipeline, brief accounts, and recommend
  next-best actions. Data flows bidirectionally through prebuilt connectors to CRMs
  (Salesforce, HubSpot), ad platforms (LinkedIn, Google, Facebook, TikTok), ABM tools,
  data warehouses (Snowflake, BigQuery), and CDPs (Segment). Its programmatic surface
  is two-part: the OAuth-secured hosted "Omni" MCP server, and the Revenue Agents
  REST API v1 (bearer token, 30 operations across agents, conversations, tasks and
  credits), which is wrapped by a first-party npm MCP server but has no published
  OpenAPI. Backed by Bessemer Venture Partners.
